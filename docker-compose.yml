version: '3.9'
services:
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres@db:5432/execution
      PGPASSWORD: postgres
      SCHWAB_MOCK_MODE: "true"
      ADMIN_API_KEY: replace-me
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: execution
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d execution"]
      interval: 5s
      timeout: 5s
      retries: 20
