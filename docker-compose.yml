version: '3.9'
services:
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://db:5432/execution
      SCHWAB_MOCK_MODE: "true"
      ADMIN_API_KEY: changeme
    ports:
      - "8000:8000"
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: execution
    ports:
      - "5432:5432"
